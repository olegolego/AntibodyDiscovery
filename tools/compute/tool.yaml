id: compute
name: Compute
version: "1.0"
category: compute
description: >
  Custom Python compute node. Connected upstream outputs are injected as
  Python variables. Assign your result to `result`.

inputs:
  - name: code
    type: python_code
    required: true
    default: "# upstream outputs are available as variables\n# assign your result to `result`\nresult = None\n"

outputs:
  - name: result
    type: json
    description: Value assigned to `result` in the code block
  - name: stdout
    type: json
    description: Captured stdout from the code execution
  - name: error
    type: json
    description: Traceback string if the code raised an exception, else null
  - name: metadata
    type: json
    description: Injected variable names and other execution metadata

runtime:
  kind: local_python
  timeout_seconds: 120
  gpu: false
