id: developability_filter
name: Developability Filter
version: "1.0"
category: bioinformatics
description: >
  Research-backed antibody developability assessment for CDR optimization loops.
  Evaluates each candidate variant against a configurable panel of sequence-based
  liability checks, then ranks passing variants by acquisition score.

inputs:
  # ── Standard batch input ──────────────────────────────────────────────────
  - name: sequences
    type: json
    required: false
    description: >
      Standard batch token: {n, variants: [{vh, vl, ...extra}, ...]} or a bare
      list [{vh, vl, ...}]. Any extra fields on each variant (scores, embeddings,
      …) are preserved on passing variants in the output. This is the preferred
      input — wire from any tool that emits a sequences output.

  # ── Legacy inputs (kept for backward-compat) ─────────────────────────────
  - name: heavy_chain_variants
    type: json
    required: false
    description: "Legacy: list of VH sequences. Prefer wiring sequences instead."
  - name: light_chain_variants
    type: json
    required: false
    description: "Legacy: list of VL sequences. Prefer wiring sequences instead."

  # ── Acquisition scores (fallback when not embedded per-variant) ───────────
  - name: acquisition_scores
    type: json
    required: false
    default: null
    description: >
      {vh_sequence: float} acquisition scores. Only used for variants that don't
      already carry an acquisition_score field.

  # ── CDR numbering scheme ─────────────────────────────────────────────────
  - name: scheme
    type: text
    required: false
    default: "imgt"
    description: >
      CDR numbering scheme passed to abnumber: imgt (default), kabat, chothia, aho, wolfguy.
      Determines which residues are considered CDR positions for oxidation, aromatic,
      polyspecificity, and CDR-H3 length checks.

  # ── Check configuration ───────────────────────────────────────────────────
  - name: check_config
    type: json
    required: false
    panel_hidden: true
    default:
      N-glycosylation: "hard"
      Deamidation: "warn"
      Isomerization: "warn"
      Oxidation-Trp: "warn"
      Oxidation-Met: "warn"
      DP-cleavage: "warn"
      Aromatic-overload: "warn"
      Hydrophobic-patch: "warn"
      pI-extreme: "warn"
      Net-charge-extreme: "warn"
      Polyspecificity: "warn"
      CDR-H3-length: "warn"
      Homopolymer: "hard"
      Unpaired-Cys: "hard"
    description: >
      Per-check mode: "hard" (always reject), "warn" (counts toward PTM budget), "off" (skip).

  - name: max_ptm_liabilities
    type: int
    required: false
    default: 3
    description: >
      Maximum allowed PTM / warn-severity liabilities before a variant is rejected.

outputs:
  - name: sequences
    type: json
    description: >
      Filtered batch token: {n, variants: [{vh, vl, ...extra}, ...]} containing
      only the variants that passed all checks. Same shape as input sequences —
      wire directly to any downstream batch-aware node. Extra fields from the
      input variants are preserved.

  - name: n_feasible
    type: int
    description: Number of variants that passed all checks.

  - name: feasible_variants
    type: json
    description: >
      Legacy keyed dict: {vh_seq: {heavy_chain, light_chain, acquisition_score,
      n_liabilities}} for passing variants.

  - name: liability_report
    type: json
    description: >
      Per-variant full report: {vh_seq: {passed, n_liabilities, liabilities: [
        {check, severity, sequence, position, description, citation}
      ]}}.

  - name: result
    type: json
    description: >
      Combined output for loop_end wiring — feasible_variants, n_feasible, and
      liability_report in one dict.

runtime:
  kind: local_python
  gpu: false
  timeout_seconds: 30
