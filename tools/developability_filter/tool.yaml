id: developability_filter
name: Developability Filter
version: "1.0"
category: bioinformatics
description: >
  Research-backed antibody developability assessment for CDR optimization loops.
  Evaluates each candidate variant against a configurable panel of sequence-based
  liability checks, then ranks passing variants by acquisition score.

inputs:
  # ── Variant lists from cdr_mutator (one edge each) ────────────────────────
  - name: heavy_chain_variants
    type: json
    required: false
    description: "List of VH sequences from cdr_mutator.heavy_chain_variants."
  - name: light_chain_variants
    type: json
    required: false
    description: "List of VL sequences from cdr_mutator.light_chain_variants. Optional for VHH."

  # ── Acquisition scores (from rcc_mlde or dnn_mlde) ───────────────────────
  - name: acquisition_scores
    type: json
    required: false
    default: null
    description: >
      {vh_sequence: float} acquisition scores from rcc_score or dnn_score node.
      Used to rank feasible variants. Variants without a score are ranked last.

  # ── CDR numbering scheme ─────────────────────────────────────────────────
  - name: scheme
    type: text
    required: false
    default: "imgt"
    description: >
      CDR numbering scheme passed to abnumber: imgt (default), kabat, chothia, aho, wolfguy.
      Determines which residues are considered CDR positions for oxidation, aromatic,
      polyspecificity, and CDR-H3 length checks.

  # ── Check configuration ───────────────────────────────────────────────────
  - name: check_config
    type: json
    required: false
    panel_hidden: true
    default:
      N-glycosylation: "hard"
      Deamidation: "warn"
      Isomerization: "warn"
      Oxidation-Trp: "warn"
      Oxidation-Met: "warn"
      DP-cleavage: "warn"
      Aromatic-overload: "warn"
      Hydrophobic-patch: "warn"
      pI-extreme: "warn"
      Net-charge-extreme: "warn"
      Polyspecificity: "warn"
      CDR-H3-length: "warn"
      Homopolymer: "hard"
      Unpaired-Cys: "hard"
    description: >
      Per-check mode: "hard" (always reject), "warn" (counts toward PTM budget), "off" (skip).

  - name: max_ptm_liabilities
    type: int
    required: false
    default: 3
    description: >
      Maximum allowed PTM / warn-severity liabilities before a variant is rejected.

outputs:
  - name: feasible_variants
    type: json
    description: >
      {vh_seq: {heavy_chain, light_chain, acquisition_score, n_liabilities}} for
      all variants that passed. Sorted by acquisition_score descending.

  - name: n_feasible
    type: int
    description: Number of variants that passed all checks.

  - name: liability_report
    type: json
    description: >
      Per-variant full report: {vh_seq: {passed, n_liabilities, liabilities: [
        {check, severity, sequence, position, description, citation}
      ]}}. Useful for debugging and logging in loop_history.

  - name: result
    type: json
    description: >
      Combined output for loop_end wiring — contains feasible_variants,
      n_feasible, and liability_report in one dict.

runtime:
  kind: local_python
  gpu: false
  timeout_seconds: 30
