id: esm_embedding
name: ESM2 Embedding
version: "2.0.0"
category: sequence_embedding
description: >
  Meta's ESM2 protein language model. Embeds VH and VL chains independently
  and returns both in a single standardised batch result.
  Four model sizes (8M-650M). No GPU required.

inputs:
  - name: vh
    type: fasta
    required: false
    default: "EVQLVESGGGLVQPGGSLRLSCAASGFTFSSYAMSWVRQAPGKGLEWVSAISGSGGSTYYADSVKGRFTISRDNSKNTLYLQMNSLRAEDTAVYYCAK"
    description: >
      Single VH sequence (raw AA or FASTA). Use 'sequences' for batch input.

  - name: vl
    type: fasta
    required: false
    default: ""
    description: >
      Single VL sequence paired with 'vh'. Leave empty to embed VH only.

  - name: sequences
    type: json
    required: false
    description: >
      Batch input: a list of {vh, vl} dicts.
      Overrides 'vh'/'vl' when provided.

  - name: model_size
    type: str
    required: false
    default: "650M"
    options:
      - "8M"
      - "35M"
      - "150M"
      - "650M"
    description: >
      ESM2 model size. 650M (1280-dim) gives the best embeddings; 8M is ~40x faster.

  - name: pool_mode
    type: str
    required: false
    default: "mean"
    options:
      - "mean"
      - "cls"
      - "per_residue"
    description: >
      Pooling strategy. 'mean' averages all residue embeddings.
      'cls' uses the [CLS] token. 'per_residue' returns all residue embeddings.

outputs:
  - name: n
    type: int
    description: Number of VH/VL pairs in the batch.

  - name: results
    type: json
    description: >
      List of n dicts: {vh, vl, emb_vh, emb_vl}.
      emb_vl is null when no VL was provided.

  - name: metadata
    type: json
    description: Model name, model_size, pool_mode, and embedding dim.

runtime:
  kind: local_python
  gpu: false
  timeout_seconds: 600
