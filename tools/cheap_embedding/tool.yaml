id: cheap_embedding
name: CHEAP Embedding
version: "1.0.0"
category: sequence_embedding
description: >
  CHEAP (Compressed Hourglass Embedding Adaptation of Proteins) — compressed
  representations of ESMFold latents. Produces embeddings 2–256× smaller than
  raw ESMFold representations while preserving structural information. Trained
  on CATH domains; 18 checkpoints cover all combinations of shorten_factor
  (1 or 2) × channel_dim (4–1024). Requires ~4 GB RAM to load ESMFold on CPU.
  Start the server first: bash tools/cheap_embedding/start.sh

inputs:
  - name: sequence
    type: fasta
    required: true
    default: "EVQLVESGGGLVQPGGSLRLSCAASGFTFSSYAMSWVRQAPGKGLEWVSAISGSGGSTYYADSVKGRFTISRDNSKNTLYLQMNSLRAEDTAVYYCAK"
    description: >
      Protein or antibody amino acid sequence (single-letter, FASTA or raw).

  - name: shorten_factor
    type: int
    required: false
    default: 1
    options:
      - "1"
      - "2"
    description: >
      Sequence length compression. 1 = same length as input; 2 = length halved
      (adjacent positions merged by the hourglass encoder).

  - name: dim
    type: int
    required: false
    default: 64
    options:
      - "4"
      - "8"
      - "16"
      - "32"
      - "64"
      - "128"
      - "256"
      - "512"
      - "1024"
    description: >
      Embedding dimension per position after compression.
      64 is a good default: 16× smaller than ESMFold (1024-dim) while retaining
      most structural information. Use 1024 for lossless ESMFold passthrough.

outputs:
  - name: embedding
    type: json
    description: Mean-pooled embedding vector (dim-dimensional float array).

  - name: residue_embeddings
    type: json
    description: Per-(compressed-)position embeddings as list of lists.

  - name: metadata
    type: json
    description: shorten_factor, dim, sequence_length, compressed_length, output_shape.

runtime:
  kind: http
  endpoint_env: CHEAP_EMBEDDING_URL
  gpu: false
  timeout_seconds: 600
