id: cheap_embedding
name: CHEAP Embedding
version: "2.0.0"
category: sequence_embedding
description: >
  CHEAP (Compressed Hourglass Embedding Adaptation of Proteins) — compressed
  ESMFold latents. Embeds VH and VL chains independently and returns both in a
  single standardised batch result. Requires ~8 GB RAM for ESMFold backbone.

inputs:
  - name: vh
    type: fasta
    required: false
    default: "EVQLVESGGGLVQPGGSLRLSCAASGFTFSSYAMSWVRQAPGKGLEWVSAISGSGGSTYYADSVKGRFTISRDNSKNTLYLQMNSLRAEDTAVYYCAK"
    description: >
      Single VH sequence (raw AA or FASTA). Use 'sequences' for batch input.
  - name: vl
    type: fasta
    required: false
    default: ""
    description: >
      Single VL sequence paired with 'vh'. Leave empty to embed VH only.
  - name: sequences
    type: json
    required: false
    description: >
      Batch input: a list of {vh, vl} dicts.
      Overrides 'vh'/'vl' when provided.
  - name: shorten_factor
    type: int
    required: false
    default: 1
    options:
      - "1"
      - "2"
    description: Sequence length compression. 1 = same length; 2 = halved.
  - name: dim
    type: int
    required: false
    default: 64
    options:
      - "4"
      - "8"
      - "16"
      - "32"
      - "64"
      - "128"
      - "256"
      - "512"
      - "1024"
    description: Embedding dimension per position after compression.

outputs:
  - name: n
    type: int
    description: Number of VH/VL pairs in the batch.
  - name: results
    type: json
    description: >
      List of n dicts: {vh, vl, emb_vh, emb_vl}.
      emb_vl is null when no VL was provided.
  - name: sequences
    type: json
    description: >
      Standard batch token: {n, variants: results} — wire directly to
      developability_filter, custom_dnn, or any batch-aware downstream node.
  - name: metadata
    type: json
    description: shorten_factor and dim.

runtime:
  kind: http
  endpoint_env: CHEAP_EMBEDDING_URL
  gpu: false
  timeout_seconds: 600
