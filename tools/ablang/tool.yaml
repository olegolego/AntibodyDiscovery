id: ablang
name: AbLang Embedding
version: "2.0.0"
category: sequence_embedding
description: >
  Antibody language model (AbLang) trained on the Observed Antibody Space.
  Embeds VH and VL chains independently (768-dim each) and returns both in a
  single standardised batch result. Runs on CPU; no GPU required.

inputs:
  - name: vh
    type: fasta
    required: false
    default: "EVQLVESGGGLVQPGGSLRLSCAASGFTFSSYAMSWVRQAPGKGLEWVSAISGSGGSTYYADSVKGRFTISRDNSKNTLYLQMNSLRAEDTAVYYCAKDRLSITIRPRYYGLDVWGQGTLVTVSS"
    description: >
      Single VH sequence (raw AA or FASTA). Use 'sequences' for batch input.
      Accepts '*' for unknown positions.

  - name: vl
    type: fasta
    required: false
    default: ""
    description: >
      Single VL sequence paired with 'vh'. Leave empty to embed VH only.

  - name: sequences
    type: json
    required: false
    description: >
      Batch input: a list of {vh, vl} dicts, e.g.
      [{"vh": "EVQL...", "vl": "DIQM..."}, ...].
      Overrides 'vh'/'vl' when provided.

  - name: mode
    type: str
    required: false
    default: seqcoding
    description: >
      'seqcoding' returns a single 768-dim vector per chain (suitable for
      downstream ML). 'rescoding' returns a 768-dim vector per residue.

outputs:
  - name: n
    type: int
    description: Number of VH/VL pairs in the batch.

  - name: results
    type: json
    description: >
      List of n dicts: {vh, vl, emb_vh, emb_vl}.
      emb_vl is null when no VL was provided.

  - name: metadata
    type: json
    description: Model name, mode, and embedding dim.

runtime:
  kind: local_python
  gpu: false
  timeout_seconds: 300
