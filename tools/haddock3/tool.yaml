id: haddock3
name: HADDOCK3 Docking
version: "3.1.0"
category: docking
description: >
  Antibody-antigen docking using HADDOCK3. CDR loops are detected automatically
  from the antibody sequence using ANARCI with your chosen numbering scheme.
  Provide the antibody PDB (e.g. from ImmuneBuilder) and the antigen PDB.
  CPU-only, takes 15–90 min depending on sampling settings.

inputs:
  - name: antibody
    type: pdb
    required: true
    description: >
      Antibody structure PDB. Chain IDs are detected automatically.
      Typically wired from ImmuneBuilder output.

  - name: antigen
    type: pdb
    required: true
    default_file: "app/tools/data/targets/spike_rbd.pdb"
    description: >
      Antigen structure PDB. Residue numbers must match antigen_active_residues exactly.
      Default: SARS-CoV-2 spike RBD. Typically wired from Target Input.

  - name: numbering_scheme
    type: str
    required: false
    default: "chothia"
    options:
      - chothia
      - kabat
      - imgt
      - martin
      - aho
    description: >
      Antibody numbering scheme used to define CDR loops.
      Chothia is the default and most widely used for docking.

  - name: antigen_chains
    type: str
    required: false
    default: ""
    description: >
      Comma-separated chain IDs to extract from the antigen PDB (e.g. "A" or "A,C").
      If empty, the first protein chain is used automatically.

  - name: antigen_active_residues
    type: str
    required: true
    default: "438 439 440 441 442 443 444 445 446 447 448 449 450 451 452 453 454 455 456 457 458 459 460 461 462 463 464 465 466 467 468 469 470 471 472 473 474 475 476 477 478 479 480 481 482 483 484 485 486 487 488 489 490 491 492 493 494 495 496 497 498 499 500 501 502 503 504 505 506"
    description: >
      Space-separated residue numbers of the antigen epitope (binding site).
      Must match residue numbers in the antigen PDB as-is.
      Default: spike RBD receptor-binding motif.

  - name: antigen_passive_residues
    type: str
    required: false
    default: "345 346 347 348 351 352 405 417 420 421 422 436 437"
    description: >
      Space-separated residue numbers surrounding the epitope (passive restraints).
      Default: spike RBD residues flanking the RBM.

  - name: vh_chain
    type: str
    required: false
    default: "H"
    description: "Chain ID for the VH (heavy) chain. Auto-detected if not found."

  - name: vl_chain
    type: str
    required: false
    default: "L"
    description: "Chain ID for the VL (light) chain. Leave empty for nanobodies/ScFv."

  - name: rigid_sampling
    type: int
    required: false
    default: 100
    description: "Number of rigid-body sampling configurations. Default 100 (faster); 1000 for production."

  - name: select_top
    type: int
    required: false
    default: 50
    description: "Number of top models passed to flexible refinement. Default 50."

outputs:
  - name: best_complex
    type: pdb
    description: "Best-scored docked antibody-antigen complex."

  - name: scores
    type: json
    description: "Top cluster CAPRI metrics: score, vdw, desolv, air, bsa (mean ± std)."

runtime:
  kind: local_python
  gpu: false
  timeout_seconds: 7200
