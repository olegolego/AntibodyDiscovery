id: abmap
name: AbMAP Embedding
version: "2.0.0"
category: sequence_embedding
description: >
  AbMAP antibody embedding with CDR-focused mutagenesis augmentation.
  Embeds VH and VL chains independently and returns both in a single
  standardised batch result. Requires ANARCI for CDR identification.

inputs:
  - name: vh
    type: fasta
    required: false
    description: >
      Single VH sequence (raw AA or FASTA). Use 'sequences' for batch input.
  - name: vl
    type: fasta
    required: false
    default: ""
    description: >
      Single VL sequence paired with 'vh'. Leave empty to embed VH only.
  - name: sequences
    type: json
    required: false
    description: >
      Batch input: a list of {vh, vl} dicts.
      Overrides 'vh'/'vl' when provided.
  - name: task
    type: str
    required: false
    default: structure
    description: Embedding head. 'structure' or 'function'.
  - name: embedding_type
    type: str
    required: false
    default: fixed
    description: Output mode. 'fixed' or 'variable'.
  - name: num_mutations
    type: int
    required: false
    default: 10
    description: In-silico mutations for AbMAP augmentation.

outputs:
  - name: n
    type: int
    description: Number of VH/VL pairs in the batch.
  - name: results
    type: json
    description: >
      List of n dicts: {vh, vl, emb_vh, emb_vl}.
      emb_vl is null when no VL was provided.
  - name: sequences
    type: json
    description: >
      Standard batch token: {n, variants: results} — wire directly to
      developability_filter, custom_dnn, or any batch-aware downstream node.
  - name: metadata
    type: json
    description: task, embedding_type, num_mutations.

runtime:
  kind: http
  endpoint_env: ABMAP_URL
  gpu: false
  timeout_seconds: 1800
