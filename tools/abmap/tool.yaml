id: abmap
name: AbMAP Embedding
version: "0.1.0"
category: sequence_embedding
description: >
  Antibody sequence embedding with AbMAP, using CDR-focused mutagenesis augmentation
  and the upstream Bepler/Berger-backed AbMAP checkpoint. Accepts a single sequence
  string or a list of sequences — automatically routes to single or batch embedding.

inputs:
  - name: sequence
    type: fasta
    required: false
    description: >
      A single VH/VL sequence string (single-letter FASTA or raw AA) OR a list of
      sequence strings for batch embedding. String → returns embedding. List → returns
      candidate_embeddings dict keyed by sequence string.
  - name: chain_type
    type: str
    required: false
    default: H
    description: Antibody chain type. Use H for heavy chains and L for light chains.
  - name: task
    type: str
    required: false
    default: structure
    description: Embedding head to use. Supported values are structure and function.
  - name: embedding_type
    type: str
    required: false
    default: fixed
    description: Output mode. Supported values are fixed and variable.
  - name: num_mutations
    type: int
    required: false
    default: 10
    description: Number of in-silico mutations used for AbMAP augmentation. Higher values improve fidelity but increase runtime.

outputs:
  - name: embedding
    type: json
    description: AbMAP embedding as a JSON array (single-sequence mode).
  - name: embeddings
    type: json
    description: List of embedding arrays (batch/multi-FASTA mode).
  - name: candidate_embeddings
    type: json
    description: >
      {sequence_string → [float]} dict, populated when a list is passed as sequence.
      Wire directly to rcc_mlde or dnn_mlde candidate_embeddings.
  - name: metadata
    type: json
    description: Embedding metadata including task, shape, CDR length, and sequence length.

runtime:
  kind: http
  endpoint_env: ABMAP_URL
  gpu: false
  timeout_seconds: 1800
